services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: trading_statistics
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_statistics"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - trading_statistics_postgres:/var/lib/postgresql/data

volumes:
  trading_statistics_postgres:
