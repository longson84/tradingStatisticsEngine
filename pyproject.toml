[project]
name = "trading-engine"
version = "0.1.0"
description = "Trading Statistics Engine — library-first backtesting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "yfinance>=1.1.0",
]

[dependency-groups]
api = [
    "alembic>=1.16.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.42.0",
]
dev = [
    "pytest>=8.0",
]
